name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      # No sibling clones: deps.edn names phone and card by git coordinate, so
      # this run also proves the library is consumable from outside the monorepo.
      # It used to clone ../phone ../card ../html ../css, which made CI pass while
      # cloud-itonami-app could not build a classpath against this library at all.
      - run: clojure -M:test
      - run: clojure -M:lint
