name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Direct deps.
      - run: git clone --depth 1 https://github.com/kotoba-lang/phone.git ../phone
      - run: git clone --depth 1 https://github.com/kotoba-lang/card.git ../card
      # Transitive: both phone and card carry a ui.cljc built on html + css, so
      # their :local/root deps must resolve even though this library requires
      # neither namespace. Omitting them fails at classpath build, not at test.
      - run: git clone --depth 1 https://github.com/kotoba-lang/html.git ../html
      - run: git clone --depth 1 https://github.com/kotoba-lang/css.git ../css
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: clojure -M:test
